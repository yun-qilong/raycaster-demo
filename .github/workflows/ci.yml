name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  post-check:
    # 固定 runner，不要用 ubuntu-latest：2026-09 起 ubuntu-latest 已迁移到
    # Ubuntu 26.04（resolute），该版本不再提供 clang-format-15 / clang-tidy-14，
    # apt 会直接报 "Unable to locate package"。
    # 这两个版本必须与本地开发机（Ubuntu 22.04）一致：noble(24.04) 的 universe
    # 源仍提供 clang-format-15(15.0.7) / clang-tidy-14(14.0.6)，格式与 tidy
    # 结果才和本地一致。后续升级本地的 clang 版本时，这里也要同步改。
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Issue Check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-issue-ref.sh HEAD

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev python3 clang-format-15 clang-tidy-14
          clang-format-15 --version
          clang-tidy-14 --version

      - name: Build
        run: |
          cmake -S pc -B build -DCMAKE_BUILD_TYPE=Release -DRAYCASTER_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build --target raycaster raycaster_ut -j $(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -L raycaster

      - name: Format
        run: |
          FILES=$(find src pc -name "*.cpp" -o -name "*.hpp" | grep -v "/build/" | grep -v "/generated/" | sort)
          FAIL=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            if ! clang-format-15 --dry-run --Werror "$f" 2>/dev/null; then
              echo "==== FORMAT ISSUES: $f ===="
              diff -u "$f" <(clang-format-15 "$f") 2>/dev/null || true
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then echo "Format check FAILED"; exit 1; fi
          echo "Format check passed"

      - name: Tidy
        env:
          CLANG_TIDY_BIN: clang-tidy-14
        run: python3 scripts/run_tidy.py
